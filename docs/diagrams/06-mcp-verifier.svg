<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="820" height="360" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#0f172a">Two paths to the same MCP server</text>

  <!-- model under test (path A source) -->
  <rect x="40" y="72" width="220" height="80" rx="9" fill="#0f172a"/>
  <text x="150" y="100" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Model under test</text>
  <text x="150" y="120" text-anchor="middle" fill="#cbd5e1" font-size="11.5">drives the tool loop</text>
  <text x="150" y="138" text-anchor="middle" fill="#94a3b8" font-size="11">results trusted into its trajectory</text>

  <!-- verifier (path B source) -->
  <rect x="40" y="208" width="220" height="80" rx="9" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="150" y="236" text-anchor="middle" fill="#115e59" font-size="14" font-weight="700">Verifier · ACP agent</text>
  <text x="150" y="256" text-anchor="middle" fill="#0f172a" font-size="11.5">calls read-only tools itself</text>
  <text x="150" y="274" text-anchor="middle" fill="#475569" font-size="11">re-derives truth · cross-checks</text>

  <!-- shared MCP server (the convergence) -->
  <rect x="566" y="140" width="214" height="80" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text x="673" y="172" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">Real MCP server</text>
  <text x="673" y="192" text-anchor="middle" font-size="11.5" fill="#475569">one live source of truth</text>
  <text x="673" y="210" text-anchor="middle" font-size="11" fill="#64748b">no mock</text>

  <!-- path A: model drives the tools (labels sit above the line) -->
  <line x1="260" y1="118" x2="562" y2="166" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="420" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#1e3a8a">PATH A · can it USE the tools?</text>
  <text x="420" y="120" text-anchor="middle" font-size="11" fill="#475569">right tool · valid args · real result</text>

  <!-- path B: verifier re-derives ground truth (labels sit below the line) -->
  <line x1="260" y1="242" x2="562" y2="196" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="428" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#115e59">PATH B · is the ANSWER true?</text>
  <text x="428" y="266" text-anchor="middle" font-size="11" fill="#475569">read-only allow-list · over ACP</text>

  <text x="30" y="350" font-size="12" fill="#64748b">The model's answer is on trial; the verifier tries it against live ground truth — read-only, fail-closed (no auth → FAIL, never a false green).</text>
</svg>
