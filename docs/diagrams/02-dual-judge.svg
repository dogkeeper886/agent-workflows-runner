<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="820" height="360" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#0f172a">Dual-judge verdict</text>

  <!-- test run -->
  <rect x="40" y="66" width="170" height="56" rx="8" fill="#0f172a"/>
  <text x="125" y="91" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Test run</text>
  <text x="125" y="109" text-anchor="middle" fill="#cbd5e1" font-size="11.5">steps + logs + exit codes</text>

  <!-- simple judge (always) -->
  <line x1="210" y1="94" x2="300" y2="94" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="304" y="58" width="300" height="124" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="324" y="84" font-size="14" font-weight="700" fill="#1e3a8a">Simple judge</text>
  <text x="588" y="84" text-anchor="end" font-size="11.5" font-weight="600" fill="#2563eb">always runs · default</text>
  <text x="324" y="108" font-size="12.5" fill="#0f172a">• exit codes are zero</text>
  <text x="324" y="129" font-size="12.5" fill="#0f172a">• expected patterns matched</text>
  <text x="324" y="150" font-size="12.5" fill="#0f172a">• no error patterns present</text>
  <text x="324" y="172" font-size="11.5" fill="#475569">deterministic · model-free · fast</text>

  <!-- LLM judge (opt-in) -->
  <line x1="454" y1="182" x2="454" y2="216" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="464" y="204" font-size="11" fill="#64748b">LLM_JUDGE_MODE=dual</text>
  <rect x="304" y="220" width="300" height="104" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="324" y="246" font-size="14" font-weight="700" fill="#115e59">LLM judge</text>
  <text x="588" y="246" text-anchor="end" font-size="11.5" font-weight="600" fill="#0d9488">opt-in</text>
  <text x="324" y="270" font-size="12.5" fill="#0f172a">semantic check: does the output</text>
  <text x="324" y="288" font-size="12.5" fill="#0f172a">meet the human-readable criteria?</text>
  <text x="324" y="310" font-size="11.5" fill="#475569">Anthropic SDK · any compatible endpoint</text>

  <!-- verdict -->
  <line x1="604" y1="120" x2="664" y2="120" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <line x1="604" y1="272" x2="664" y2="180" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="668" y="92" width="120" height="92" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="728" y="120" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Verdict</text>
  <text x="728" y="144" text-anchor="middle" font-size="11.5" fill="#475569">simple only,</text>
  <text x="728" y="161" text-anchor="middle" font-size="11.5" fill="#475569">or both must</text>
  <text x="728" y="178" text-anchor="middle" font-size="11.5" fill="#475569">pass in dual</text>

  <text x="30" y="350" font-size="12" fill="#64748b">Default is the simple judge alone. Opt in the LLM judge and a test passes only when both agree.</text>
</svg>
