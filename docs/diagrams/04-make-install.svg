<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="820" height="360" fill="#ffffff"/>
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#0f172a">Porting the runner into your repo</text>
  <text x="30" y="56" font-size="12.5" fill="#475569"><tspan font-family="ui-monospace, monospace" fill="#0f172a">make install TARGET=/path/to/your-repo NAME=your-app</tspan></text>

  <!-- this repo (example) -->
  <rect x="30" y="82" width="232" height="232" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="146" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#1e3a8a">this repo</text>
  <text x="146" y="126" text-anchor="middle" font-size="11.5" fill="#2563eb">the worked example</text>
  <text x="50" y="156" font-size="12" fill="#0f172a">cicd/tests/ — runner source</text>
  <text x="50" y="180" font-size="12" fill="#0f172a">testcases/ — example YAML</text>
  <text x="50" y="204" font-size="12" fill="#0f172a">cicd/scripts/ — helpers</text>
  <text x="50" y="228" font-size="12" fill="#0f172a">.github/workflows/ — CI</text>
  <text x="50" y="252" font-size="12" fill="#0f172a">.claude/skills + rules</text>
  <text x="50" y="276" font-size="12" fill="#0f172a">CLAUDE.md</text>

  <!-- copy arrow -->
  <line x1="262" y1="198" x2="360" y2="198" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="311" y="186" text-anchor="middle" font-size="11.5" fill="#64748b">copies +</text>
  <text x="311" y="214" text-anchor="middle" font-size="11.5" fill="#64748b">stamps NAME</text>

  <!-- your repo -->
  <rect x="364" y="82" width="232" height="232" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="480" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#0f172a">your repo</text>
  <text x="480" y="126" text-anchor="middle" font-size="11.5" fill="#475569">same layout, your name</text>
  <text x="384" y="156" font-size="12" fill="#475569">cicd/tests/</text>
  <text x="384" y="180" font-size="12" fill="#475569">testcases/</text>
  <text x="384" y="204" font-size="12" fill="#475569">cicd/scripts/</text>
  <text x="384" y="228" font-size="12" fill="#475569">.github/workflows/</text>
  <text x="384" y="252" font-size="12" fill="#475569">.claude/skills + rules</text>
  <text x="384" y="276" font-size="12" fill="#475569">CLAUDE.md</text>

  <!-- then adapt -->
  <line x1="596" y1="198" x2="654" y2="198" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <rect x="658" y="140" width="132" height="116" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="724" y="166" text-anchor="middle" font-size="13" font-weight="700" fill="#92400e">then adapt</text>
  <text x="724" y="190" text-anchor="middle" font-size="11.5" fill="#0f172a">edit config.ts</text>
  <text x="724" y="208" text-anchor="middle" font-size="11.5" fill="#0f172a">write your</text>
  <text x="724" y="224" text-anchor="middle" font-size="11.5" fill="#0f172a">own test cases</text>
  <text x="724" y="246" text-anchor="middle" font-size="10.5" fill="#92400e">every repo differs</text>

  <text x="30" y="344" font-size="12" fill="#64748b">An example you port, not a package you install unchanged. (Or run /install for the agent-driven path.)</text>
</svg>
