<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="820" height="360" fill="#ffffff"/>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#0f172a">The ACP agent judge</text>

  <!-- Judge (ACP client) -->
  <rect x="30" y="100" width="180" height="92" rx="10" fill="#0f172a"/>
  <text x="120" y="130" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">Agent judge</text>
  <text x="120" y="151" text-anchor="middle" font-size="12" fill="#cbd5e1">ACP client</text>
  <text x="120" y="171" text-anchor="middle" font-size="11" fill="#94a3b8">refuses tool calls</text>

  <!-- spawn arrow: judge -> agent -->
  <line x1="210" y1="146" x2="320" y2="146" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="265" y="136" text-anchor="middle" font-size="11" fill="#64748b">spawn · stdio</text>
  <text x="265" y="162" text-anchor="middle" font-size="10.5" fill="#64748b">ACP handshake</text>

  <!-- ACP agent (hero) -->
  <rect x="324" y="74" width="288" height="150" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
  <text x="344" y="102" font-size="14" font-weight="700" fill="#115e59">ACP agent</text>
  <text x="592" y="102" text-anchor="end" font-size="11.5" font-weight="600" fill="#0d9488">keyless</text>
  <text x="344" y="128" font-size="12.5" fill="#0f172a">authenticates itself — no API key</text>
  <text x="344" y="148" font-size="11" fill="#475569">~/.claude · CLAUDE_CODE_OAUTH_TOKEN</text>
  <line x1="344" y1="162" x2="592" y2="162" stroke="#0d9488" stroke-width="1" opacity="0.35"/>
  <text x="344" y="182" font-size="11" fill="#475569">default agent:</text>
  <text x="344" y="200" font-size="10.5" fill="#475569">@agentclientprotocol/claude-agent-acp</text>

  <!-- drives arrow: agent -> model -->
  <line x1="612" y1="149" x2="648" y2="149" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="630" y="140" text-anchor="middle" font-size="10" fill="#64748b">drives</text>

  <!-- Model -->
  <rect x="652" y="108" width="130" height="82" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="717" y="140" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">Model</text>
  <text x="717" y="160" text-anchor="middle" font-size="11" fill="#475569">reasoning model</text>
  <text x="717" y="177" text-anchor="middle" font-size="11" fill="#64748b">lives in the agent</text>

  <!-- verdict down from agent -->
  <line x1="430" y1="224" x2="430" y2="246" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="440" y="239" font-size="10" fill="#64748b">returns</text>

  <!-- JSON verdict -->
  <rect x="300" y="250" width="204" height="74" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="402" y="278" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">JSON verdict</text>
  <text x="402" y="300" text-anchor="middle" font-size="11.5" fill="#0f172a">{ pass, reason, evidence }</text>
  <text x="402" y="316" text-anchor="middle" font-size="10.5" fill="#475569">parsed from the agent's reply</text>

  <!-- verdict elbow back to the judge -->
  <line x1="300" y1="287" x2="124" y2="287" stroke="#94a3b8" stroke-width="2"/>
  <line x1="124" y1="287" x2="124" y2="194" stroke="#94a3b8" stroke-width="2" marker-end="url(#a)"/>
  <text x="212" y="303" text-anchor="middle" font-size="10" fill="#64748b">verdict → judge</text>

  <!-- JUDGE_AGENT swap note -->
  <rect x="620" y="212" width="170" height="76" rx="6" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="632" y="234" font-size="12" font-weight="700" fill="#d97706">JUDGE_AGENT</text>
  <text x="632" y="252" font-size="11" fill="#92400e">point it at another ACP</text>
  <text x="632" y="267" font-size="11" fill="#92400e">agent to swap model /</text>
  <text x="632" y="282" font-size="11" fill="#92400e">vendor — config, not code</text>

  <text x="30" y="348" font-size="12" fill="#64748b">Unreachable or unauthenticated agent → detected up front, falls back to the simple judge.</text>
</svg>
