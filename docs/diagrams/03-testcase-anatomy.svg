<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="820" height="430" fill="#ffffff"/>
  <text x="30" y="34" font-size="17" font-weight="700" fill="#0f172a">Anatomy of a YAML test case</text>

  <!-- suites row -->
  <text x="30" y="66" font-size="12.5" fill="#475569">Organized by suite:</text>
  <rect x="150" y="52" width="86" height="24" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="193" y="69" text-anchor="middle" font-size="12" fill="#0f172a">build</text>
  <rect x="246" y="52" width="110" height="24" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="301" y="69" text-anchor="middle" font-size="12" fill="#0f172a">integration</text>
  <rect x="366" y="52" width="64" height="24" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="398" y="69" text-anchor="middle" font-size="12" fill="#0f172a">e2e</text>

  <!-- the card -->
  <rect x="30" y="92" width="760" height="312" rx="10" fill="#fbfdff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- identity fields -->
  <text x="50" y="120" font-size="13" font-weight="700" fill="#1e3a8a">Identity</text>
  <text x="50" y="144" font-size="12.5" fill="#0f172a"><tspan font-weight="700">id</tspan> · <tspan font-weight="700">name</tspan> · <tspan font-weight="700">suite</tspan> · <tspan font-weight="700">priority</tspan> · <tspan font-weight="700">timeout</tspan></text>
  <text x="50" y="166" font-size="12.5" fill="#0f172a"><tspan font-weight="700">dependencies</tspan> (run after these tests pass) · <tspan font-weight="700">tags</tspan> (filter with --tag)</text>

  <line x1="50" y1="184" x2="770" y2="184" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- steps -->
  <text x="50" y="210" font-size="13" font-weight="700" fill="#115e59">steps[]</text>
  <text x="110" y="210" font-size="11.5" fill="#475569">— commands run in order</text>
  <rect x="50" y="222" width="720" height="92" rx="8" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
  <text x="68" y="246" font-size="12.5" fill="#0f172a"><tspan font-weight="700">name</tspan> — what the step does</text>
  <text x="68" y="268" font-size="12.5" fill="#0f172a"><tspan font-weight="700">command</tspan> — the shell command to run</text>
  <text x="68" y="290" font-size="12.5" fill="#0f172a"><tspan font-weight="700">expectPatterns</tspan> — must appear · <tspan font-weight="700">rejectPatterns</tspan> — must not appear · <tspan font-weight="700">timeout</tspan></text>
  <text x="68" y="308" font-size="11" fill="#475569">capture values with {{variable}} to pass into later steps</text>

  <line x1="50" y1="332" x2="770" y2="332" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- criteria -->
  <text x="50" y="358" font-size="13" font-weight="700" fill="#92400e">criteria</text>
  <rect x="50" y="370" width="720" height="22" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="68" y="386" font-size="12" fill="#0f172a">human-readable pass conditions — what the LLM judge evaluates the run against</text>
</svg>
