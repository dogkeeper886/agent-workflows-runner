# Legacy — see ci.yml + test-run.yml for the per-feature workflow pattern
name: Test Suite

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        type: choice
        options:
          - "build"
          - "integration"
          - "e2e"
          - "all"
      judge_mode:
        description: "Test judge mode"
        required: false
        default: "simple"
        type: choice
        options:
          - "simple"
          - "dual"
  workflow_call:
    inputs:
      suite:
        description: "Test suite to run"
        required: true
        type: string
      judge_mode:
        description: "Test judge mode (simple, dual)"
        required: false
        default: "simple"
        type: string
    outputs:
      result:
        description: "Test result"
        value: ${{ jobs.test.outputs.result }}

jobs:
  test:
    name: Run ${{ inputs.suite }} Tests
    runs-on: self-hosted
    outputs:
      result: ${{ steps.run-tests.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test runner dependencies
        run: cd cicd/tests && npm ci

      - name: Run tests
        id: run-tests
        env:
          # Simple by default; dual opts in the agent judge, which runs keyless via the
          # runner's own Claude Code login (~/.claude on the self-hosted runner) — no
          # Console API key, no secret. JUDGE_AGENT (repo variable) swaps the ACP
          # agent/model; empty uses the bundled Claude ACP agent.
          JUDGE_MODE: ${{ inputs.judge_mode }}
          JUDGE_AGENT: ${{ vars.JUDGE_AGENT }}
        run: |
          cd cicd/tests

          # Build suite flag
          SUITE_FLAG=""
          if [ "${{ inputs.suite }}" != "all" ]; then
            SUITE_FLAG="--suite ${{ inputs.suite }}"
          fi

          echo "Suite: ${{ inputs.suite }}"
          echo "Judge mode: $JUDGE_MODE"

          # Run tests with JSON output
          npx tsx src/cli.ts run $SUITE_FLAG --format json > /tmp/test-results.json || true

          echo "--- JSON Results ---"
          cat /tmp/test-results.json

      - name: Check test results
        run: |
          FAILED=$(jq '.summary.failed' /tmp/test-results.json)
          echo "Failed tests: $FAILED"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED test(s) failed"
            exit 1
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.suite }}-test-results
          path: |
            /tmp/test-results.json
            cicd/results/
