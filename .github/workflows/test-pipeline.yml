# Legacy — see ci.yml + test-run.yml for the per-feature workflow pattern
name: Full Test Pipeline

on:
  workflow_dispatch:
    inputs:
      judge_mode:
        description: "Test judge mode"
        required: false
        default: "simple"
        type: choice
        options:
          - "simple"
          - "dual"

jobs:
  build:
    name: Build Tests
    uses: ./.github/workflows/test-suite.yml
    secrets: inherit
    with:
      suite: build
      judge_mode: ${{ inputs.judge_mode }}

  integration:
    name: Integration Tests
    needs: build
    uses: ./.github/workflows/test-suite.yml
    secrets: inherit
    with:
      suite: integration
      judge_mode: ${{ inputs.judge_mode }}

  e2e:
    name: E2E Tests
    needs: integration
    uses: ./.github/workflows/test-suite.yml
    secrets: inherit
    with:
      suite: e2e
      judge_mode: ${{ inputs.judge_mode }}
