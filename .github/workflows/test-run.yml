name: Test Run

# Reusable test runner — called by per-feature or per-suite workflows.
# Supports both --tag and --suite filtering.

on:
  workflow_call:
    inputs:
      tag:
        description: "Run tests with this tag (e.g., auth, build)"
        required: false
        type: string
      suite:
        description: "Run tests in this suite (e.g., build, integration, e2e)"
        required: false
        type: string
      judge_mode:
        description: "Judge mode (simple = deterministic only, dual = simple + agent judge)"
        required: false
        default: "simple"
        type: string
    outputs:
      result:
        description: "Test result"
        value: ${{ jobs.test.outputs.result }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.run-tests.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: cd cicd/tests && npm ci

      - name: Build test runner
        run: cd cicd/tests && npm run build

      - name: Run tests
        id: run-tests
        env:
          # Simple by default; dual opts in the agent judge, which runs keyless on a
          # Claude Code subscription via CLAUDE_CODE_OAUTH_TOKEN — no Console API key.
          # JUDGE_AGENT (repo variable) swaps the ACP agent/model; empty uses the
          # bundled Claude ACP agent. Model + auth live in the agent, not here.
          JUDGE_MODE: ${{ inputs.judge_mode }}
          JUDGE_AGENT: ${{ vars.JUDGE_AGENT }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          cd cicd/tests

          # Build filter flags
          FILTER_FLAGS=""
          if [ -n "${{ inputs.tag }}" ]; then
            FILTER_FLAGS="--tag ${{ inputs.tag }}"
          elif [ -n "${{ inputs.suite }}" ]; then
            FILTER_FLAGS="--suite ${{ inputs.suite }}"
          fi

          echo "Filter: $FILTER_FLAGS"
          echo "Judge mode: $JUDGE_MODE"

          npx tsx src/cli.ts run $FILTER_FLAGS --format json > /tmp/test-results.json || true

          echo "--- Results ---"
          cat /tmp/test-results.json

      - name: Check results
        run: |
          FAILED=$(jq '.summary.failed' /tmp/test-results.json)
          echo "Failed tests: $FAILED"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED test(s) failed"
            exit 1
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ inputs.tag || inputs.suite || 'all' }}
          path: |
            /tmp/test-results.json
            cicd/results/
