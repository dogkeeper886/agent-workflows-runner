name: Test Run

# Reusable test runner — called by per-feature or per-suite workflows.
# Supports both --tag and --suite filtering.

on:
  workflow_call:
    inputs:
      tag:
        description: "Run tests with this tag (e.g., auth, build)"
        required: false
        type: string
      suite:
        description: "Run tests in this suite (e.g., build, integration, e2e)"
        required: false
        type: string
      judge_mode:
        description: "Judge mode (simple = deterministic only, dual = simple + LLM judge)"
        required: false
        default: "simple"
        type: string
      judge_model:
        description: "LLM model for judging (dual mode)"
        required: false
        default: "claude-haiku-4-5-20251001"
        type: string
    outputs:
      result:
        description: "Test result"
        value: ${{ jobs.test.outputs.result }}

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.run-tests.outcome }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: cd cicd/tests && npm ci

      - name: Build test runner
        run: cd cicd/tests && npm run build

      - name: Run tests
        id: run-tests
        env:
          # Simple by default; dual opts in the LLM judge. URL/model/key configure
          # the Anthropic SDK — leave LLM_JUDGE_URL unset for the hosted Anthropic API,
          # or set it (repo variable) to any Anthropic-compatible endpoint.
          LLM_JUDGE_MODE: ${{ inputs.judge_mode }}
          LLM_JUDGE_MODEL: ${{ vars.LLM_JUDGE_MODEL || inputs.judge_model }}
          LLM_JUDGE_URL: ${{ vars.LLM_JUDGE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cd cicd/tests

          # Build filter flags
          FILTER_FLAGS=""
          if [ -n "${{ inputs.tag }}" ]; then
            FILTER_FLAGS="--tag ${{ inputs.tag }}"
          elif [ -n "${{ inputs.suite }}" ]; then
            FILTER_FLAGS="--suite ${{ inputs.suite }}"
          fi

          echo "Filter: $FILTER_FLAGS"
          echo "Judge mode: $LLM_JUDGE_MODE"

          npx tsx src/cli.ts run $FILTER_FLAGS --format json > /tmp/test-results.json || true

          echo "--- Results ---"
          cat /tmp/test-results.json

      - name: Check results
        run: |
          FAILED=$(jq '.summary.failed' /tmp/test-results.json)
          echo "Failed tests: $FAILED"
          if [ "$FAILED" -gt 0 ]; then
            echo "::error::$FAILED test(s) failed"
            exit 1
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ inputs.tag || inputs.suite || 'all' }}
          path: |
            /tmp/test-results.json
            cicd/results/
