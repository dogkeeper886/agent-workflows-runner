name: CI Pipeline

on:
  workflow_dispatch:
    inputs:
      judge_mode:
        description: "Judge mode"
        required: false
        default: "simple"
        type: choice
        options:
          - "simple"
          - "dual"

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  # Add per-feature test jobs here. Each runs in parallel after build.
  # Example:
  #
  # test-auth:
  #   name: "Test: Auth"
  #   needs: build
  #   uses: ./.github/workflows/test-run.yml
  #   secrets: inherit          # passes CLAUDE_CODE_OAUTH_TOKEN through for dual mode
  #   with:
  #     tag: auth
  #     judge_mode: ${{ inputs.judge_mode }}

  # Default: run all tests (no tag filter)
  test-all:
    name: "Test: All"
    needs: build
    uses: ./.github/workflows/test-run.yml
    secrets: inherit            # passes CLAUDE_CODE_OAUTH_TOKEN through for dual mode
    with:
      judge_mode: ${{ inputs.judge_mode }}
